<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuxcyn Pack Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,system-ui,sans-serif;
  background:#08080d;
  color:#fff;
  padding:20px;
}

.container{
  width:min(650px,100%);
  margin:auto;
}

.card{
  background:#15151d;
  border:1px solid #292936;
  border-radius:20px;
  padding:22px;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
}

h1{margin:0 0 8px}

.subtitle{
  color:#999;
  margin-bottom:25px;
}

label{
  display:block;
  margin:16px 0 7px;
  font-weight:bold;
}

input,textarea{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #30303c;
  background:#09090e;
  color:#fff;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#8b5cf6;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.secondary{
  background:#292933;
}

.status{
  margin-top:18px;
  padding:13px;
  border-radius:10px;
  display:none;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.status.info{
  display:block;
  background:#1d2330;
  color:#bcd4ff;
}

.status.success{
  display:block;
  background:#13271a;
  color:#8cffaa;
}

.status.error{
  display:block;
  background:#2b1518;
  color:#ff9da8;
}

.hidden{
  display:none!important;
}

.preview{
  display:none;
  width:100%;
  max-height:250px;
  object-fit:cover;
  margin-top:12px;
  border-radius:12px;
}

.small{
  color:#888;
  font-size:12px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

  <div class="card" id="loginCard">

    <h1>🔐 Zuxcyn Admin</h1>

    <div class="subtitle">
      Panel upload Pack by Zuxcyn
    </div>

    <label>Owner Key</label>

    <input
      id="ownerKey"
      type="password"
      placeholder="Masukkan Owner Key"
      autocomplete="off"
    >

    <button onclick="openPanel()">
      BUKA PANEL
    </button>

    <div id="loginStatus" class="status"></div>

  </div>


  <div class="card hidden" id="adminCard">

    <h1>🚀 Upload Pack</h1>

    <div class="subtitle">
      Upload data pack ke GitHub melalui Cloudflare Worker.
    </div>

    <label>Nama Pack</label>

    <input
      id="packName"
      type="text"
      placeholder="Contoh: Shake Pack"
    >

    <label>Deskripsi</label>

    <textarea
      id="packDesc"
      placeholder="Deskripsi pack..."
    ></textarea>

    <label>Link Preset</label>

    <input
      id="packUrl"
      type="url"
      placeholder="https://alightcreative.com/am/share/..."
    >

    <label>Nama JPG</label>

    <input
      id="packImage"
      type="text"
      placeholder="Contoh: shake.jpg"
    >

    <div class="small">
      File foto harus sudah ada di:
      <b>assets/preset/</b>
    </div>

    <img id="preview" class="preview">

    <button
      id="publishButton"
      onclick="publishPack()"
    >
      🚀 PUBLISH PACK
    </button>

    <button
      class="secondary"
      onclick="testWorker()"
    >
      🔎 CEK KONEKSI WORKER
    </button>

    <button
      class="secondary"
      onclick="logout()"
    >
      LOGOUT
    </button>

    <div id="status" class="status"></div>

  </div>

</div>


<script>

/* =====================================================
   URL WORKER — SUDAH DIISI
   ===================================================== */

const WORKER_URL =
"https://zuxcyn-pack-api.mandasukaaku.workers.dev";


/* =====================================================
   ELEMENT
   ===================================================== */

const loginCard =
document.getElementById("loginCard");

const adminCard =
document.getElementById("adminCard");

const ownerKey =
document.getElementById("ownerKey");

const statusBox =
document.getElementById("status");

const loginStatus =
document.getElementById("loginStatus");

const publishButton =
document.getElementById("publishButton");

const preview =
document.getElementById("preview");


/* =====================================================
   LOGIN
   ===================================================== */

function openPanel(){

  const key =
    ownerKey.value.trim();

  if(!key){

    loginStatus.className =
      "status error";

    loginStatus.textContent =
      "Masukkan Owner Key terlebih dahulu.";

    return;
  }

  sessionStorage.setItem(
    "zuxcyn_owner_key",
    key
  );

  loginCard.classList.add("hidden");
  adminCard.classList.remove("hidden");

  showStatus(
    "info",
    "Panel terbuka. Tekan CEK KONEKSI WORKER terlebih dahulu."
  );
}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout(){

  sessionStorage.removeItem(
    "zuxcyn_owner_key"
  );

  location.reload();
}


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(type,message){

  statusBox.className =
    "status " + type;

  statusBox.textContent =
    message;
}


/* =====================================================
   CEK WORKER
   ===================================================== */

async function testWorker(){

  showStatus(
    "info",
    "⏳ Menghubungi Worker..."
  );

  try{

    const response =
      await fetch(
        WORKER_URL,
        {
          method:"GET",
          cache:"no-store"
        }
      );

    const text =
      await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error(
        "Worker tidak mengembalikan JSON.\n\n" +
        text.substring(0,300)
      );
    }

    if(!response.ok){

      throw new Error(
        data.error ||
        "HTTP " + response.status
      );
    }

    if(data.ok !== true){

      throw new Error(
        data.error ||
        "Worker mengembalikan status gagal."
      );
    }

    showStatus(
      "success",
      "✅ WORKER TERHUBUNG!\n\n" +
      "Jumlah pack: " +
      (
        Array.isArray(data.packs)
        ? data.packs.length
        : 0
      )
    );

  }catch(error){

    showStatus(
      "error",
      "❌ GAGAL MENGHUBUNGI WORKER\n\n" +
      error.message
    );
  }
}


/* =====================================================
   PUBLISH
   ===================================================== */

async function publishPack(){

  const adminKey =
    sessionStorage.getItem(
      "zuxcyn_owner_key"
    );

  if(!adminKey){

    showStatus(
      "error",
      "Session Owner Key tidak ditemukan. Login kembali."
    );

    return;
  }


  const name =
    document.getElementById(
      "packName"
    ).value.trim();

  const desc =
    document.getElementById(
      "packDesc"
    ).value.trim();

  const url =
    document.getElementById(
      "packUrl"
    ).value.trim();

  const image =
    document.getElementById(
      "packImage"
    ).value.trim();


  if(!name){

    showStatus(
      "error",
      "Nama Pack wajib diisi."
    );

    return;
  }

  if(!url){

    showStatus(
      "error",
      "Link Preset wajib diisi."
    );

    return;
  }

  if(!image){

    showStatus(
      "error",
      "Nama JPG wajib diisi."
    );

    return;
  }


  if(
    image.includes("/") ||
    image.includes("\\") ||
    image.includes("..")
  ){

    showStatus(
      "error",
      "Nama JPG cukup nama file saja. Contoh: shake.jpg"
    );

    return;
  }


  publishButton.disabled =
    true;

  publishButton.textContent =
    "⏳ PUBLISHING...";


  showStatus(
    "info",
    "⏳ Mengirim Pack ke Worker..."
  );


  try{

    const response =
      await fetch(
        WORKER_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            adminKey:
              adminKey,

            name:
              name,

            desc:
              desc,

            url:
              url,

            image:
              image

          })

        }
      );


    const text =
      await response.text();


    let data;

    try{

      data =
        JSON.parse(text);

    }catch{

      throw new Error(
        "Worker mengembalikan response bukan JSON:\n" +
        text.substring(0,300)
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "HTTP " +
        response.status
      );

    }


    if(data.ok !== true){

      throw new Error(
        data.error ||
        "Publish gagal."
      );

    }


    showStatus(
      "success",
      "✅ PACK BERHASIL DIPUBLISH!\n\n" +
      "Nama: " +
      name +
      "\n" +
      "Foto: " +
      image +
      "\n\n" +
      "Data pack sudah dikirim ke GitHub."
    );


    document.getElementById(
      "packName"
    ).value = "";

    document.getElementById(
      "packDesc"
    ).value = "";

    document.getElementById(
      "packUrl"
    ).value = "";

    document.getElementById(
      "packImage"
    ).value = "";

    preview.style.display =
      "none";


  }catch(error){

    let message =
      error.message ||
      "Unknown error";


    if(
      message === "Failed to fetch"
    ){

      message =
        "Browser tidak bisa menghubungi Worker.\n\n" +
        "Pastikan URL Worker aktif dan website menggunakan HTTPS.";
    }


    showStatus(
      "error",
      "❌ GAGAL PUBLISH\n\n" +
      message
    );


  }finally{

    publishButton.disabled =
      false;

    publishButton.textContent =
      "🚀 PUBLISH PACK";

  }

}


/* =====================================================
   PREVIEW FOTO
   ===================================================== */

document
.getElementById("packImage")
.addEventListener(
  "input",
  function(){

    const filename =
      this.value.trim();

    if(!filename){

      preview.style.display =
        "none";

      return;
    }


    preview.src =
      "../assets/preset/" +
      encodeURIComponent(filename);


    preview.style.display =
      "block";


    preview.onerror =
      function(){

        preview.style.display =
          "none";

      };

  }
);


/* =====================================================
   AUTO LOGIN
   ===================================================== */

if(
  sessionStorage.getItem(
    "zuxcyn_owner_key"
  )
){

  loginCard.classList.add("hidden");
  adminCard.classList.remove("hidden");

}

</script>

</body>
</html>
