<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuxcyn Pack Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,system-ui,sans-serif;
  background:#08080d;
  color:#fff;
  padding:20px;
}

.container{
  width:min(650px,100%);
  margin:auto;
}

.card{
  background:#15151d;
  border:1px solid #292936;
  border-radius:20px;
  padding:22px;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
  margin-bottom:20px;
}

h1{margin:0 0 8px}
h2{margin:0 0 12px; font-size: 20px;}

.subtitle{
  color:#999;
  margin-bottom:20px;
}

label{
  display:block;
  margin:14px 0 6px;
  font-weight:bold;
  font-size:14px;
}

input,textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #30303c;
  background:#09090e;
  color:#fff;
  outline:none;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.checkbox-group{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:14px;
  background:#0d0d14;
  padding:12px;
  border-radius:10px;
  border:1px solid #292936;
}

.checkbox-group input{
  width:20px;
  height:20px;
  cursor:pointer;
}

.checkbox-group label{
  margin:0;
  cursor:pointer;
}

button{
  width:100%;
  margin-top:14px;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#8b5cf6;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.secondary{ background:#292933; }
.btn-danger{ background:#e11d48; }
.btn-warning{ background:#d97706; }

.status{
  margin-top:16px;
  padding:13px;
  border-radius:10px;
  display:none;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.status.info{ display:block; background:#1d2330; color:#bcd4ff; }
.status.success{ display:block; background:#13271a; color:#8cffaa; }
.status.error{ display:block; background:#2b1518; color:#ff9da8; }

.hidden{ display:none!important; }

.small{
  color:#888;
  font-size:12px;
  line-height:1.5;
}

.preset-item{
  background:#0d0d14;
  border:1px solid #262635;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

.preset-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.preset-badge{
  font-size:11px;
  padding:4px 8px;
  border-radius:6px;
}

.badge-locked{ background:#50141a; color:#ff8b97; }
.badge-active{ background:#103923; color:#7ef5aa; }

.preset-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="container">

  <!-- HALAMAN: LOGIN -->
  <div class="card" id="viewLogin">
    <h1>🔐 Zuxcyn Admin</h1>
    <div class="subtitle">Panel upload & kontrol Pack by Zuxcyn</div>

    <label>Owner Key</label>
    <input id="ownerKey" type="password" placeholder="Masukkan Owner Key" autocomplete="off">

    <button onclick="openPanel()">BUKA PANEL</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <!-- HALAMAN: DASHBOARD UTAMA -->
  <div id="viewDashboard" class="hidden">
    
    <!-- KARTU UPLOAD (CLEAN TANPA CHECKBOX LOCK) -->
    <div class="card">
      <h1>🚀 Upload Pack Baru</h1>
      <div class="subtitle">Upload data pack baru ke web utama.</div>

      <label>Nama Pack</label>
      <input id="uploadName" type="text" placeholder="Contoh: Shake Pack">

      <label>Deskripsi</label>
      <textarea id="uploadDesc" placeholder="Deskripsi pack..."></textarea>

      <label>Link Preset</label>
      <input id="uploadUrl" type="url" placeholder="https://alightcreative.com/am/share/...">

      <label>Nama JPG</label>
      <input id="uploadImage" type="text" placeholder="Contoh: assets/preset/Shake.jpg">

      <button id="uploadBtn" onclick="publishNewPack()">🚀 PUBLISH PACK</button>
      <button class="secondary" onclick="testWorker()">🔎 CEK KONEKSI WORKER</button>

      <div id="uploadStatus" class="status"></div>
    </div>

    <!-- KARTU DAFTAR PRESET -->
    <div class="card">
      <h2>📦 Daftar Preset di Web Utama</h2>
      <div class="small" style="margin-bottom: 15px;">Kelola preset yang sudah tayang di web utama.</div>

      <button class="secondary" onclick="loadAllPacks()" style="margin-top:0; margin-bottom:15px;">🔄 REFRESH DAFTAR PRESET</button>

      <div id="presetListContainer">
        <div style="text-align:center; color:#777;">Memuat preset...</div>
      </div>

      <button class="secondary" onclick="logout()" style="margin-top:20px;">LOGOUT</button>
    </div>

  </div>

  <!-- HALAMAN KHUSUS: EDIT PRESET (LOCK, CUSTOM TEXT & UPDATE DATA) -->
  <div id="viewEditPage" class="hidden">
    <div class="card">
      <h1 id="editPageTitle">✏️ Edit Preset</h1>
      <div class="subtitle">Ubah data atau atur kunci (lock) dan custom pesan.</div>

      <input type="hidden" id="editIndex">

      <label>Nama Pack</label>
      <input id="editName" type="text">

      <label>Deskripsi</label>
      <textarea id="editDesc"></textarea>

      <label>Link Preset</label>
      <input id="editUrl" type="url">

      <label>Nama JPG</label>
      <input id="editImage" type="text">

      <div class="checkbox-group">
        <input type="checkbox" id="editIsLocked">
        <label for="editIsLocked">🔒 Kunci preset ini (Lock Preset)</label>
      </div>

      <label>Pesan Kunci (Custom Text)</label>
      <input id="editLockMessage" type="text" placeholder="Contoh: maaf sementara aku lock dulu preset ini">

      <button id="saveEditBtn" onclick="saveEditedPack()">💾 SIMPAN PERUBAHAN PRESET</button>
      <button class="secondary" onclick="closeEditPage()">⬅️ KEMBALI KE DASHBOARD</button>

      <div id="editStatus" class="status"></div>
    </div>
  </div>

</div>

<script>
const WORKER_URL = "https://zuxcyn-pack-api.mandasukaaku.workers.dev";
let cachedPacks = [];

const viewLogin = document.getElementById("viewLogin");
const viewDashboard = document.getElementById("viewDashboard");
const viewEditPage = document.getElementById("viewEditPage");

const ownerKey = document.getElementById("ownerKey");
const loginStatus = document.getElementById("loginStatus");

const uploadStatus = document.getElementById("uploadStatus");
const editStatus = document.getElementById("editStatus");
const presetListContainer = document.getElementById("presetListContainer");

function showView(viewName){
  viewLogin.classList.add("hidden");
  viewDashboard.classList.add("hidden");
  viewEditPage.classList.add("hidden");

  if(viewName === "login") viewLogin.classList.remove("hidden");
  if(viewName === "dashboard") viewDashboard.classList.remove("hidden");
  if(viewName === "edit") viewEditPage.classList.remove("hidden");
}

function openPanel(){
  const key = ownerKey.value.trim();
  if(!key){
    loginStatus.className = "status error";
    loginStatus.textContent = "Masukkan Owner Key terlebih dahulu.";
    return;
  }
  sessionStorage.setItem("zuxcyn_owner_key", key);
  showView("dashboard");
  loadAllPacks();
}

function logout(){
  sessionStorage.removeItem("zuxcyn_owner_key");
  location.reload();
}

function showStatus(box, type, message){
  box.className = "status " + type;
  box.textContent = message;
}

async function testWorker(){
  showStatus(uploadStatus, "info", "⏳ Menghubungi Worker...");
  try{
    const res = await fetch(WORKER_URL, { method: "GET", cache: "no-store" });
    const data = await res.json();
    if(!res.ok || data.ok !== true) throw new Error(data.error || "Gagal terhubung.");
    showStatus(uploadStatus, "success", `✅ WORKER TERHUBUNG!\nJumlah Pack: ${data.packs ? data.packs.length : 0}`);
  }catch(e){
    showStatus(uploadStatus, "error", "❌ Worker Gagal: " + e.message);
  }
}

async function loadAllPacks(){
  presetListContainer.innerHTML = `<div style="text-align:center; color:#888;">⏳ Mengambil data preset...</div>`;
  try{
    const res = await fetch(WORKER_URL + "?t=" + Date.now(), { method: "GET", cache: "no-store" });
    const data = await res.json();
    if(!res.ok || data.ok !== true) throw new Error(data.error || "Gagal membaca pack");
    cachedPacks = Array.isArray(data.packs) ? data.packs : [];
    renderPresetManager();
  }catch(err){
    presetListContainer.innerHTML = `<div style="color:#ff8b97;">❌ Gagal memuat: ${err.message}</div>`;
  }
}

function renderPresetManager(){
  if(cachedPacks.length === 0){
    presetListContainer.innerHTML = `<div style="text-align:center; color:#666;">Belum ada preset terdaftar.</div>`;
    return;
  }

  presetListContainer.innerHTML = "";
  cachedPacks.forEach((p, idx) => {
    const isLocked = Boolean(p.isLocked);
    const box = document.createElement("div");
    box.className = "preset-item";
    box.innerHTML = `
      <div class="preset-header">
        <strong style="font-size:16px;">${p.name || 'Tanpa Nama'}</strong>
        <span class="preset-badge ${isLocked ? 'badge-locked' : 'badge-active'}">
          ${isLocked ? '🔒 TERKUNCI' : '✅ TERBUKA'}
        </span>
      </div>
      <div style="font-size:13px; color:#aaa; margin:6px 0;">${p.desc || '-'}</div>
      ${isLocked && p.lockMessage ? `<div style="font-size:12px; color:#ff9da8; margin-bottom:8px;">Pesan Kunci: "${p.lockMessage}"</div>` : ''}
      <div class="preset-actions">
        <button class="btn-warning" onclick="openEditPage(${idx})">✏️ Edit / Ganti Pesan</button>
        <button class="btn-danger" onclick="kickPreset(${idx})">🗑️ Kick (Hapus)</button>
      </div>
    `;
    presetListContainer.appendChild(box);
  });
}

function openEditPage(index){
  const pack = cachedPacks[index];
  if(!pack) return;

  document.getElementById("editIndex").value = index;
  document.getElementById("editName").value = pack.name || "";
  document.getElementById("editDesc").value = pack.desc || "";
  document.getElementById("editUrl").value = pack.url || "";
  document.getElementById("editImage").value = pack.image || "";
  document.getElementById("editIsLocked").checked = Boolean(pack.isLocked);
  document.getElementById("editLockMessage").value = pack.lockMessage || "";
  document.getElementById("editPageTitle").textContent = `✏️ Edit: ${pack.name}`;

  editStatus.className = "status";
  showView("edit");
}

function closeEditPage(){
  showView("dashboard");
}

async function saveEditedPack(){
  const adminKey = sessionStorage.getItem("zuxcyn_owner_key");
  const index = parseInt(document.getElementById("editIndex").value);

  const name = document.getElementById("editName").value.trim();
  const desc = document.getElementById("editDesc").value.trim();
  const url = document.getElementById("editUrl").value.trim();
  const image = document.getElementById("editImage").value.trim();
  const isLocked = document.getElementById("editIsLocked").checked;
  const lockMessage = document.getElementById("editLockMessage").value.trim();

  if(!name || !url || !image){
    showStatus(editStatus, "error", "Nama Pack, Link Preset, dan Nama JPG wajib diisi.");
    return;
  }

  const saveBtn = document.getElementById("saveEditBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "⏳ MENYIMPAN...";

  try{
    cachedPacks[index] = {
      name, desc, url, image, isLocked,
      lockMessage: lockMessage || "maaf sementara aku lock dulu preset ini"
    };

    await syncAllPacks(adminKey, cachedPacks);
    showStatus(editStatus, "success", "✅ Perubahan berhasil disimpan ke web utama!");

    setTimeout(() => {
      closeEditPage();
      loadAllPacks();
    }, 800);
  }catch(e){
    showStatus(editStatus, "error", "❌ Gagal: " + e.message);
  }finally{
    saveBtn.disabled = false;
    saveBtn.textContent = "💾 SIMPAN PERUBAHAN PRESET";
  }
}

/* UPLOAD PACK BARU SECARA DEFAULT STATUS: TERBUKA / TIDAK TERKUNCI */
async function publishNewPack(){
  const adminKey = sessionStorage.getItem("zuxcyn_owner_key");
  const name = document.getElementById("uploadName").value.trim();
  const desc = document.getElementById("uploadDesc").value.trim();
  const url = document.getElementById("uploadUrl").value.trim();
  const image = document.getElementById("uploadImage").value.trim();

  if(!name || !url || !image){
    showStatus(uploadStatus, "error", "Nama Pack, Link Preset, dan Nama JPG wajib diisi.");
    return;
  }

  const uploadBtn = document.getElementById("uploadBtn");
  uploadBtn.disabled = true;
  uploadBtn.textContent = "⏳ PUBLISHING...";

  try{
    const newPack = {
      name, 
      desc, 
      url, 
      image, 
      isLocked: false, 
      lockMessage: ""
    };

    const updatedList = [...cachedPacks, newPack];
    await syncAllPacks(adminKey, updatedList);

    showStatus(uploadStatus, "success", `✅ Pack "${name}" berhasil di-publish!`);

    document.getElementById("uploadName").value = "";
    document.getElementById("uploadDesc").value = "";
    document.getElementById("uploadUrl").value = "";
    document.getElementById("uploadImage").value = "";

    await loadAllPacks();
  }catch(e){
    showStatus(uploadStatus, "error", "❌ Gagal upload: " + e.message);
  }finally{
    uploadBtn.disabled = false;
    uploadBtn.textContent = "🚀 PUBLISH PACK";
  }
}

async function kickPreset(index){
  const pack = cachedPacks[index];
  if(!confirm(`Yakin ingin menendang/menghapus "${pack.name}" dari web utama?`)) return;

  const adminKey = sessionStorage.getItem("zuxcyn_owner_key");
  try{
    const updatedList = cachedPacks.filter((_, i) => i !== index);
    await syncAllPacks(adminKey, updatedList);
    await loadAllPacks();
  }catch(e){
    alert("Gagal kick: " + e.message);
  }
}

async function syncAllPacks(adminKey, packsArray){
  const response = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      adminKey: adminKey,
      bulkUpdate: true,
      packs: packsArray
    })
  });

  const data = await response.json();
  if(!response.ok || data.ok !== true){
    throw new Error(data.error || "Gagal sinkronisasi data.");
  }
}

if(sessionStorage.getItem("zuxcyn_owner_key")){
  showView("dashboard");
  loadAllPacks();
}
</script>

</body>
</html>
