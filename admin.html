<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Panel - Zuxcyn</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,Arial;background:#08080b;color:#fff;display:grid;place-items:center;padding:20px}
.box{width:min(680px,100%);background:#15151b;border:1px solid #ffffff18;border-radius:24px;padding:25px;box-shadow:0 25px 70px #0008}
input,textarea{width:100%;padding:13px;margin:7px 0 15px;background:#09090c;color:#fff;border:1px solid #ffffff18;border-radius:11px}
button,a{padding:12px 16px;border:0;border-radius:11px;background:#815cff;color:#fff;font-weight:800;text-decoration:none;display:inline-block;cursor:pointer}
.muted,small{color:#999;line-height:1.6}.hidden{display:none}.error{color:#ff7b91}.ok{color:#7dffa8}
</style>
</head>
<body>
<div class="box">
<div id="login">
<h1>🔐 Owner Panel</h1>
<p class="muted">Masukkan Owner Key untuk membuka panel upload Pack by Zuxcyn.</p>
<input id="key" type="password" placeholder="Owner Key" autocomplete="off">
<button onclick="login()">BUKA PANEL</button>
<p id="err" class="error"></p>
</div>

<div id="panel" class="hidden">
<h1>⚙️ Upload Pack</h1>
<p class="muted">Panel owner berhasil dibuka.</p>
<label>Nama pack</label><input id="name" placeholder="Contoh: Shake Pack">
<label>Deskripsi</label><textarea id="desc" placeholder="Deskripsi pack"></textarea>
<label>Link preset/download</label><input id="url" placeholder="https://...">
<button onclick="add()">TAMBAH PACK</button>
<button onclick="logout()" style="background:#292930;margin-left:6px">LOGOUT</button>
<p id="msg"></p>
<hr style="border-color:#ffffff12">
<small>Catatan: pada GitHub Pages, Owner Key di JavaScript bukan keamanan tingkat server. Untuk keamanan sungguhan, gunakan backend + autentikasi server.</small>
</div>
</div>

<script>
const OWNER_KEY = "ZUXCYN-ADMIN-2026";

function login(){
  if(document.getElementById("key").value === OWNER_KEY){
    sessionStorage.setItem("zuxcyn_owner","1");
    document.getElementById("login").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
  }else{
    document.getElementById("err").textContent="Owner Key salah.";
  }
}
function logout(){
  sessionStorage.removeItem("zuxcyn_owner");
  location.reload();
}
function add(){
  const n=document.getElementById("name").value.trim();
  const d=document.getElementById("desc").value.trim();
  const u=document.getElementById("url").value.trim();
  if(!n||!u){document.getElementById("msg").className="error";document.getElementById("msg").textContent="Nama dan link wajib diisi.";return}
  const p=JSON.parse(localStorage.getItem("zuxcynPacks")||"[]");
  p.push({name:n,desc:d,url:u});
  localStorage.setItem("zuxcynPacks",JSON.stringify(p));
  document.getElementById("msg").className="ok";
  document.getElementById("msg").textContent="Pack tersimpan di browser ini.";
}
if(sessionStorage.getItem("zuxcyn_owner")==="1"){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
}
</script>
</body>
</html>
